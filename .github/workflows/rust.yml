name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-25.05

    - name: Check formatting
      run: nix-shell --run "cargo fmt -- --check"

    - name: Run clippy
      run: nix-shell --run "cargo clippy -- -D warnings"

    - name: Build
      run: nix-shell --run "cargo build --verbose"

    - name: Run tests
      run: nix-shell --run "cargo test --verbose"

    - name: Build release
      run: nix-shell --run "cargo build --release --verbose"

    - name: Build with Nix
      run: nix-build
