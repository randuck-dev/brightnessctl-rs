[package]
name = "brightnessctl-rs"
version = "0.1.0"
edition = "2024"
default-run = "brightnessctl-rs"

[[bin]]
name = "brightnessctl-rs"
path = "src/main.rs"

[[bin]]
name = "brightnessctl-rs-client"
path = "src/bin/gui.rs"


[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.12"
strum = "0.27.2"
strum_macros = "0.27.2"
dirs = "6.0.0"
toml = "0.9.8"
serde = {version="1.0", features = ["derive"]}
gtk4 = "0.10.1"
gtk4-layer-shell = "0.6.3"
udev = "0.9"


[profile.release]
strip=true

